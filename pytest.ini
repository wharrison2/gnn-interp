[pytest]
testpaths = tests
pythonpath = .
norecursedirs = .venv .git __pycache__ outputs
markers =
    slow: training or cross-validation runs (deselect with -m "not slow")
    needs_circuit_tracer: uses the real circuit_tracer package (skipped if not installed)
    gpu: needs a CUDA device (skipped if unavailable)
filterwarnings =
    ignore::DeprecationWarning:torch_geometric
